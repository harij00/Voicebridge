
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceBridge - Translator</title>

<style>
* { box-sizing: border-box; }

body {
        margin: 0;
            font-family: Arial, sans-serif;
                background: #f3f5fa;
                    color: #20243a;
                        min-height: 100vh;
                            display: flex;
                                justify-content: center;
                                    align-items: center;
                                        padding: 20px;
}

.app {
        width: 100%;
            max-width: 520px;
                background: white;
                    padding: 28px;
                        border-radius: 22px;
                            box-shadow: 0 10px 40px #00000012;
}

h1 { margin: 0; color: #5146e5; }
.subtitle { color: #888; margin-bottom: 25px; }

h3 { font-size: 15px; margin-bottom: 10px; }

textarea, select {
        width: 100%;
            padding: 14px;
                border: 1px solid #ddd;
                    border-radius: 12px;
                        font-size: 15px;
                            background: white;
}

textarea {
        min-height: 115px;
            resize: vertical;
}

button {
        border: none;
            border-radius: 12px;
                padding: 14px 18px;
                    cursor: pointer;
                        font-size: 15px;
                            font-weight: bold;
}

.mic {
        background: #5146e5;
            color: white;
                width: 100%;
                    margin: 15px 0 22px;
}

.translate {
        background: #5146e5;
            color: white;
                width: 100%;
                    margin-top: 15px;
}

.output {
        background: #f3f2ff;
            padding: 16px;
                border-radius: 12px;
                    min-height: 90px;
                        margin-top: 15px;
                            white-space: pre-wrap;
                                overflow-wrap: anywhere;
}

.status {
        color: #777;
            text-align: center;
                font-size: 13px;
}

button:disabled { opacity: .6; }
</style>
</head>

<body>
<div class="app">

    <h1>VoiceBridge 🌍</h1>
        <p class="subtitle">Speak. Understand. Translate.</p>

            <h3>Your Speech</h3>

                <textarea id="transcript"
                        placeholder="Your spoken words will appear here..."></textarea>

                            <button class="mic" id="mic" onclick="startSpeech()">
                                    🎙 Start Speaking
                                        </button>

                                            <p class="status" id="status">Ready to listen</p>

                                                <h3>Translate Into</h3>

                                                    <select id="language">
                                                            <option value="hi">Hindi</option>
                                                                    <option value="te">Telugu</option>
                                                                            <option value="ta">Tamil</option>
                                                                                    <option value="kn">Kannada</option>
                                                                                            <option value="ml">Malayalam</option>
                                                                                                    <option value="bn">Bengali</option>
                                                                                                            <option value="mr">Marathi</option>
                                                                                                                    <option value="gu">Gujarati</option>
                                                                                                                            <option value="pa">Punjabi</option>
                                                                                                                                    <option value="ur">Urdu</option>
                                                                                                                                            <option value="en">English</option>
                                                                                                                                                    <option value="es">Spanish</option>
                                                                                                                                                            <option value="fr">French</option>
                                                                                                                                                                    <option value="de">German</option>
                                                                                                                                                                            <option value="it">Italian</option>
                                                                                                                                                                                    <option value="pt">Portuguese</option>
                                                                                                                                                                                            <option value="ru">Russian</option>
                                                                                                                                                                                                    <option value="ja">Japanese</option>
                                                                                                                                                                                                            <option value="ko">Korean</option>
                                                                                                                                                                                                                    <option value="zh-CN">Chinese (Simplified)</option>
                                                                                                                                                                                                                            <option value="ar">Arabic</option>
                                                                                                                                                                                                                                    <option value="tr">Turkish</option>
                                                                                                                                                                                                                                            <option value="id">Indonesian</option>
                                                                                                                                                                                                                                                    <option value="th">Thai</option>
                                                                                                                                                                                                                                                            <option value="vi">Vietnamese</option>
                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                    <button class="translate" id="translate"
                                                                                                                                                                                                                                                                            onclick="translateText()">Translate</button>

                                                                                                                                                                                                                                                                                <h3>Translated Text</h3>

                                                                                                                                                                                                                                                                                    <div class="output" id="result">
                                                                                                                                                                                                                                                                                            Your translation will appear here...
                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                const transcript = document.getElementById("transcript");
                                                                                                                                                                                                                                                                                                const statusText = document.getElementById("status");
                                                                                                                                                                                                                                                                                                const mic = document.getElementById("mic");

                                                                                                                                                                                                                                                                                                function startSpeech() {
                                                                                                                                                                                                                                                                                                        const SpeechRecognition =
                                                                                                                                                                                                                                                                                                                window.SpeechRecognition ||
                                                                                                                                                                                                                                                                                                                        window.webkitSpeechRecognition;

                                                                                                                                                                                                                                                                                                                            if (!SpeechRecognition) {
                                                                                                                                                                                                                                                                                                                                        alert("Speech recognition is not supported. Please use Chrome.");
                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                const recognition = new SpeechRecognition();

                                                                                                                                                                                                                                                                                                                                    // Browser locale is used for this basic demo.
                                                                                                                                                                                                                                                                                                                                        recognition.lang = navigator.language || "en-US";
                                                                                                                                                                                                                                                                                                                                            recognition.continuous = false;
                                                                                                                                                                                                                                                                                                                                                recognition.interimResults = true;

                                                                                                                                                                                                                                                                                                                                                    recognition.onstart = () => {
                                                                                                                                                                                                                                                                                                                                                                statusText.textContent = "Listening...";
                                                                                                                                                                                                                                                                                                                                                                        mic.textContent = "Listening...";
                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                        recognition.onresult = (event) => {
                                                                                                                                                                                                                                                                                                                                                                    let text = "";
                                                                                                                                                                                                                                                                                                                                                                            for (let i = 0; i < event.results.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                            text += event.results[i][0].transcript;
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                    transcript.value = text;
                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                            recognition.onerror = (event) => {
                                                                                                                                                                                                                                                                                                                                                                        statusText.textContent = "Error: " + event.error;
                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                recognition.onend = () => {
                                                                                                                                                                                                                                                                                                                                                                            statusText.textContent = "Speech captured";
                                                                                                                                                                                                                                                                                                                                                                                    mic.textContent = "🎙 Start Speaking";
                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                    recognition.start();
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                async function translateText() {
                                                                                                                                                                                                                                                                                                        const text = transcript.value.trim();
                                                                                                                                                                                                                                                                                                            const target = document.getElementById("language").value;
                                                                                                                                                                                                                                                                                                                const result = document.getElementById("result");
                                                                                                                                                                                                                                                                                                                    const button = document.getElementById("translate");

                                                                                                                                                                                                                                                                                                                        if (!text) {
                                                                                                                                                                                                                                                                                                                                    alert("Please speak or enter some text first.");
                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                            button.disabled = true;
                                                                                                                                                                                                                                                                                                                                button.textContent = "Translating...";
                                                                                                                                                                                                                                                                                                                                    result.textContent = "Please wait...";

                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                    const response = await fetch(
                                                                                                                                                                                                                                                                                                                                                                    `/api/translate?text=${encodeURIComponent(text)}&target=${encodeURIComponent(target)}`
                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                            if (!response.ok) throw new Error("Translation service error");

                                                                                                                                                                                                                                                                                                                                                                    const data = await response.json();

                                                                                                                                                                                                                                                                                                                                                                            if (data.responseStatus !== 200) {
                                                                                                                                                                                                                                                                                                                                                                                            throw new Error(data.responseDetails || "Translation failed");
                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                    result.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                data.responseData.translatedText;

                                                                                                                                                                                                                                                                                                                                        } catch (error) {
                                                                                                                                                                                                                                                                                                                                                    result.textContent = "Translation failed: " + error.message;
                                                                                                                                                                                                                                                                                                                                        } finally {
                                                                                                                                                                                                                                                                                                                                                    button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                            button.textContent = "Translate";
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                </html>
                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                    )
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                            }
}
